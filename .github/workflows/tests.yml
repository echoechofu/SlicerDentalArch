name: Numerical tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy vtk
      - name: Run synthetic numerical tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
